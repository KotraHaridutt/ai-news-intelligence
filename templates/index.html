<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI News Analyst</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Add simple styles for the summary content */
        .prose p { margin-bottom: 1rem; }
        .prose ul { list-style-type: disc; margin-left: 1.5rem; }
        .prose ol { list-style-type: decimal; margin-left: 1.5rem; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="max-w-6xl mx-auto mt-16 p-6">
        <h1 class="text-3xl font-bold text-center mb-4">AI News Analyst 🧠</h1>
        <p class="text-center text-gray-600 mb-6">
            Ask any topic. I'll analyze today's news, find the key themes, and give you a synthesized report.
        </p>

        <div class="flex gap-2">
            <input id="query" type="text" class="flex-1 border p-3 rounded-lg" placeholder="Enter your topic, e.g. 'Future of AI in healthcare'">
            <button id="analyze-btn" onclick="fetchNews()" class="bg-blue-600 text-white px-4 rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-blue-600">Analyze</button>
        </div>

        <div id="loading" class="hidden text-center mt-6 text-blue-600 font-medium">
            <p>Analyzing... This can take a moment for a new topic.</p>
        </div>

        <div id="error" role="alert" class="hidden mt-6 p-4 border border-red-300 rounded-lg bg-red-50 text-red-700"></div>

        <div id="result" class="hidden mt-8 grid grid-cols-4 gap-8">

            <div class="col-span-4 md:col-span-3">
                <h2 class="text-xl font-semibold mb-3">Intelligence Report</h2>
                <div id="summary" class="mb-6 p-4 border rounded-lg bg-white shadow-sm">
                    </div>
                
                <h3 class="font-semibold mb-2">Cited Sources</h3>
                <ul id="cited-sources" class="list-disc ml-5 space-y-1 text-sm">
                    </ul>
            </div>

            <div class="col-span-4 md:col-span-1">
                <h2 class="text-xl font-semibold mb-3">Related Links</h2>
                <div id="related-links" class="space-y-3">
                    </div>
            </div>

        </div>

    </div>

    <script>
        // Only absolute http(s) URLs become links; javascript:, data: and anything unparseable don't
        function safeUrl(url) {
            try {
                const parsed = new URL(url);
                return (parsed.protocol === "http:" || parsed.protocol === "https:") ? parsed.href : null;
            } catch (e) {
                return null;
            }
        }

        // Builds a link with DOM methods. Titles come from news sites, so they are set with
        // textContent and can never be parsed as HTML. Unsafe URLs are shown as plain text.
        function makeLink(url, text, className) {
            const href = safeUrl(url);
            const el = document.createElement(href ? "a" : "span");
            el.className = className;
            el.textContent = text || href || "Untitled";
            if (href) {
                el.setAttribute("href", href);
                el.setAttribute("target", "_blank");
                // noopener: the opened page can't control this tab through window.opener
                el.setAttribute("rel", "noopener noreferrer");
            }
            return el;
        }

        // A full build takes ~30 s; after this long the request is given up
        const REQUEST_TIMEOUT_MS = 120000;

        // The message to show for an error response. The server sends a user-friendly
        // message as {"detail": "..."} for every failure it knows about; a response without
        // one comes from somewhere else (e.g. Render's proxy while the server is starting).
        function friendlyError(status, detail) {
            if (typeof detail === "string" && detail.trim()) return detail;
            if (status === 502 || status === 503 || status === 504) {
                return "The server is starting up or busy. Please wait a few seconds and try again.";
            }
            return "Something went wrong on our side. Please try again.";
        }

        function showError(message) {
            const errorEl = document.getElementById("error");
            // textContent, not innerHTML: server text is shown as text, never parsed as HTML
            errorEl.textContent = message;
            errorEl.classList.remove("hidden");
        }

        async function fetchNews() {
            const query = document.getElementById("query").value.trim();
            const button = document.getElementById("analyze-btn");
            const loading = document.getElementById("loading");
            const errorEl = document.getElementById("error");
            const resultDiv = document.getElementById("result");

            // --- NEW: Get all our new element IDs ---
            const summaryEl = document.getElementById("summary");
            const citedSourcesEl = document.getElementById("cited-sources");
            const relatedLinksEl = document.getElementById("related-links");

            // A request is already running (the button is disabled until it finishes)
            if (button.disabled) return;

            errorEl.classList.add("hidden");
            if (!query) return showError("Please enter a topic first.");

            button.disabled = true;
            button.textContent = "Analyzing...";
            loading.classList.remove("hidden");
            resultDiv.classList.add("hidden");

            // Clear old results
            summaryEl.innerHTML = "";
            citedSourcesEl.innerHTML = "";
            relatedLinksEl.innerHTML = "";

            // Gives up on a request that hangs (e.g. a dropped connection) instead of waiting forever
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

            try {
                const response = await fetch("/query", { // URL is still /query
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query }),
                    signal: controller.signal
                });

                const responseText = await response.text();
                let data = null;

                try {
                    data = JSON.parse(responseText);
                } catch (parseError) {
                    console.error("Failed to parse JSON:", responseText);
                }

                if (!response.ok) {
                    // Our errors look like {"detail": "No news from the last 2 days was found for ..."}
                    showError(friendlyError(response.status, data && data.detail));
                    return;
                }

                if (data === null) {
                    // The raw response is in the console (logged above) for debugging
                    showError("The server sent an unexpected response. Please try again.");
                    return;
                }

                console.log("Received data:", data); // Good for debugging

                if (data.error) {
                    showError(data.error);
                    return;
                }
                
                // --- START: NEW RENDER LOGIC ---

                // 1. Render Summary (HTML from the server; markdown2 safe_mode has already escaped any raw HTML)
                if (!data.summary_html) {
                    // The server reports an empty answer as an error, so this shouldn't happen
                    showError("The AI couldn't write the report. Please try again.");
                    return;
                }
                summaryEl.innerHTML = `
                    <div class="prose max-w-none">
                        ${data.summary_html}
                    </div>
                `;

                // 2. Render Cited Sources
                if (data.cited_sources && data.cited_sources.length > 0) {
                    data.cited_sources.forEach(item => {
                        const li = document.createElement("li");
                        li.appendChild(makeLink(item.url, item.title, "text-blue-600 underline"));
                        citedSourcesEl.appendChild(li);
                    });
                } else {
                    citedSourcesEl.innerHTML = "<li>No specific sources were cited.</li>";
                }

                // 3. Render Related Links (Our new section)
                if (data.related_links && data.related_links.length > 0) {
                    data.related_links.forEach(item => {
                        const card = document.createElement("div");
                        card.className = "p-3 border rounded-lg bg-white text-sm shadow-sm";
                        card.appendChild(makeLink(item.url, item.title, "font-medium text-blue-700 hover:underline"));
                        const source = document.createElement("p");
                        source.className = "text-gray-500 text-xs mt-1";
                        source.textContent = item.source || "";
                        card.appendChild(source);
                        relatedLinksEl.appendChild(card);
                    });
                } else {
                    relatedLinksEl.innerHTML = "<p>No related links found.</p>";
                }

                // --- END: NEW RENDER LOGIC ---

                resultDiv.classList.remove("hidden"); // Show the results

            } catch (networkError) {
                console.error("Network error:", networkError);
                if (networkError.name === "AbortError") {
                    showError("The request took too long. Please try again.");
                } else {
                    showError("Couldn't reach the server. Check your internet connection and try again.");
                }
            } finally {
                clearTimeout(timer);
                // Runs on every path (success, error, network failure), so the button always comes back
                loading.classList.add("hidden");
                button.disabled = false;
                button.textContent = "Analyze";
            }
        }
    </script>
</body>
</html>
