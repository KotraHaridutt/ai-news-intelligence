<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI News Analyst</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Add simple styles for the summary content */
        .prose p { margin-bottom: 1rem; }
        .prose ul { list-style-type: disc; margin-left: 1.5rem; }
        .prose ol { list-style-type: decimal; margin-left: 1.5rem; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="max-w-6xl mx-auto mt-16 p-6">
        <h1 class="text-3xl font-bold text-center mb-4">AI News Analyst 🧠</h1>
        <p class="text-center text-gray-600 mb-6">
            Ask any topic. I'll analyze today's news, find the key themes, and give you a synthesized report.
        </p>

        <div class="flex gap-2">
            <input id="query" type="text" class="flex-1 border p-3 rounded-lg" placeholder="Enter your topic, e.g. 'Future of AI in healthcare'">
            <button id="analyze-btn" onclick="fetchNews()" class="bg-blue-600 text-white px-4 rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-blue-600">Analyze</button>
        </div>

        <!-- Topics followed in this browser (feature 1). Hidden while the list is empty -->
        <section id="following" class="hidden mt-6 p-4 border rounded-lg bg-white shadow-sm" aria-label="Followed topics">
            <h2 class="font-semibold mb-2">Following</h2>
            <ul id="following-list" class="divide-y text-sm"></ul>
        </section>

        <div id="loading" class="hidden text-center mt-6 text-blue-600 font-medium">
            <p id="loading-text">Analyzing... This can take a moment for a new topic.</p>
        </div>

        <div id="error" role="alert" class="hidden mt-6 p-4 border border-red-300 rounded-lg bg-red-50 text-red-700"></div>
        <div id="notice" role="status" class="hidden mt-6 p-4 border border-blue-200 rounded-lg bg-blue-50 text-blue-800 break-words"></div>

        <div id="result" class="hidden mt-8 grid grid-cols-4 gap-8">

            <div class="col-span-4 md:col-span-3">
                <!-- Three views of the same topic. Timeline and Contradictions are loaded on first click -->
                <div role="tablist" aria-label="Views" class="flex gap-1 mb-4 border-b">
                    <button id="tab-report" role="tab" aria-selected="true" onclick="showView('report')" class="px-4 py-2 -mb-px">Report</button>
                    <button id="tab-timeline" role="tab" aria-selected="false" onclick="showView('timeline')" class="px-4 py-2 -mb-px">Timeline</button>
                    <button id="tab-contradictions" role="tab" aria-selected="false" onclick="showView('contradictions')" class="px-4 py-2 -mb-px">Contradictions</button>
                </div>
                <h2 id="view-title" class="text-xl font-semibold mb-3">Intelligence Report</h2>
                <div id="summary" class="p-4 border rounded-lg bg-white shadow-sm">
                    </div>
                <!-- 👍 / 👎 on the answer above (feature 2, Section J) -->
                <div id="rating" class="mb-6"></div>

                <h3 class="font-semibold mb-2">Cited Sources</h3>
                <ul id="cited-sources" class="list-disc ml-5 space-y-1 text-sm">
                    </ul>

                <!-- Follow this topic: later checks show only what this report didn't contain -->
                <div class="mt-6 flex flex-wrap items-center gap-3">
                    <button id="follow-btn" onclick="followTopic()" class="border border-blue-600 text-blue-700 px-4 py-2 rounded-lg hover:bg-blue-50 disabled:opacity-50 disabled:cursor-not-allowed">Follow this topic</button>
                    <span id="follow-note" class="text-sm text-gray-600"></span>
                </div>
            </div>

            <div class="col-span-4 md:col-span-1">
                <h2 class="text-xl font-semibold mb-3">Related Links</h2>
                <div id="related-links" class="space-y-3">
                    </div>
            </div>

        </div>

        <!-- What's new in a followed topic since the last check (feature 1) -->
        <section id="update-view" class="hidden mt-8" aria-live="polite">
            <h2 id="update-title" class="text-xl font-semibold mb-1"></h2>
            <p id="update-window" class="text-sm text-gray-600 mb-3"></p>
            <p id="update-gap" class="hidden text-sm mb-3 p-3 rounded-lg bg-amber-50 text-amber-800"></p>
            <p id="update-message" class="hidden text-sm mb-3 p-3 rounded-lg bg-amber-50 text-amber-800"></p>
            <div id="update-body" class="space-y-4"></div>
            <button id="log-btn" onclick="toggleLog()" class="mt-6 text-sm text-blue-700 hover:underline disabled:opacity-50">Story log ▸</button>
            <div id="story-log" class="hidden mt-3 space-y-3 text-sm"></div>
        </section>

    </div>

    <script>
        // Only absolute http(s) URLs become links; javascript:, data: and anything unparseable don't
        function safeUrl(url) {
            try {
                const parsed = new URL(url);
                return (parsed.protocol === "http:" || parsed.protocol === "https:") ? parsed.href : null;
            } catch (e) {
                return null;
            }
        }

        // Builds a link with DOM methods. Titles come from news sites, so they are set with
        // textContent and can never be parsed as HTML. Unsafe URLs are shown as plain text.
        function makeLink(url, text, className) {
            const href = safeUrl(url);
            const el = document.createElement(href ? "a" : "span");
            el.className = className;
            el.textContent = text || href || "Untitled";
            if (href) {
                el.setAttribute("href", href);
                el.setAttribute("target", "_blank");
                // noopener: the opened page can't control this tab through window.opener
                el.setAttribute("rel", "noopener noreferrer");
            }
            return el;
        }

        // A small element with text (never HTML) and classes
        function textEl(tag, text, className) {
            const el = document.createElement(tag);
            if (className) el.className = className;
            el.textContent = text;
            return el;
        }

        // A full build takes ~30 s and the server gives the AI step at most 75 s, so a slow
        // request still gets the server's own message first. After this long it is given up.
        const REQUEST_TIMEOUT_MS = 120000;

        // The message to show for an error response. The server sends a user-friendly
        // message as {"detail": "..."} for every failure it knows about; a response without
        // one comes from somewhere else (e.g. Render's proxy while the server is starting).
        function friendlyError(status, detail) {
            if (typeof detail === "string" && detail.trim()) return detail;
            if (status === 502 || status === 503 || status === 504) {
                return "The server is starting up or busy. Please wait a few seconds and try again.";
            }
            return "Something went wrong on our side. Please try again.";
        }

        function showError(message) {
            const errorEl = document.getElementById("error");
            // textContent, not innerHTML: server text is shown as text, never parsed as HTML
            errorEl.textContent = message;
            errorEl.classList.remove("hidden");
        }

        function hideError() {
            document.getElementById("error").classList.add("hidden");
            document.getElementById("notice").classList.add("hidden");
        }

        // A message that isn't an error (e.g. "Link copied")
        function showNotice(message) {
            const el = document.getElementById("notice");
            el.textContent = message;
            el.classList.remove("hidden");
        }

        // The three views of a topic: where each one's answer comes from and how it is shown
        const VIEWS = {
            report: {
                endpoint: "/query", field: "summary_html", title: "Intelligence Report",
                loading: "Analyzing... This can take a moment for a new topic.",
                empty: "The AI couldn't write the report. Please try again.",
            },
            timeline: {
                endpoint: "/api/timeline", field: "timeline_html", title: "Timeline",
                loading: "Writing the timeline...",
                empty: "The AI couldn't write the timeline. Please try again.",
            },
            contradictions: {
                endpoint: "/api/contradictions", field: "analysis_html", title: "Conflicting Reports",
                loading: "Looking for conflicting reports...",
                empty: "The AI couldn't write the analysis of conflicting reports. Please try again.",
            },
        };

        let busy = false;          // a request is running: Analyze, the tabs and Follow wait for it
        let shownQuery = null;     // the topic of the report on screen; the tabs ask about this one
        let answers = {};          // view -> {html, sources, answerId}, kept until the next Analyze
        let activeView = "report";
        let currentUpdate = null;  // the check result on screen (its watch_id opens the story log)
        // answers[view] and the check on screen also keep their rating: {answerId, canRate, rating}

        // An error whose message is meant for the user. Any other error is a bug in this page.
        // status: the HTTP status, when the server sent one (a 404 on a check means the topic expired)
        // ref: the server's reference for this error (the end of its trace id), shown with the
        // message so a reported error can be found in the server's traces
        class ShownError extends Error {
            constructor(message, status, ref) { super(message); this.status = status; this.ref = ref; }
        }

        // Only the expected shape (8 hex characters) is shown: anything else in "ref" is ignored
        const REF = /^[0-9a-f]{8}$/;

        function messageFor(error) {
            if (error instanceof ShownError) {
                return typeof error.ref === "string" && REF.test(error.ref) ? `${error.message} (Ref: ${error.ref})` : error.message;
            }
            console.error(error);
            return "Something went wrong on our side. Please try again.";
        }

        // One request to our API, shared by every call on the page: the 120 s timeout, network
        // errors, the server's own error messages and invalid JSON are handled here once.
        // Returns the parsed response, or throws a ShownError with the message to show.
        async function apiRequest(method, endpoint, body) {
            // Gives up on a request that hangs (e.g. a dropped connection) instead of waiting forever
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
            const options = { method, signal: controller.signal };
            if (body !== undefined) {
                options.headers = { "Content-Type": "application/json" };
                options.body = JSON.stringify(body);
            }
            let response, responseText;
            try {
                response = await fetch(endpoint, options);
                responseText = await response.text();
            } catch (networkError) {
                console.error("Network error:", networkError);
                throw new ShownError(networkError.name === "AbortError"
                    ? "The request took too long. Please try again."
                    : "Couldn't reach the server. Check your internet connection and try again.");
            } finally {
                clearTimeout(timer);
            }

            let data = null;
            try {
                data = JSON.parse(responseText);
            } catch (parseError) {
                console.error("Failed to parse JSON:", responseText);
            }
            if (!response.ok) {
                // Our errors look like {"detail": "No news from the last 2 days was found for ...", "ref": "1a2b3c4d"}
                throw new ShownError(friendlyError(response.status, data && data.detail), response.status, data && data.ref);
            }
            if (data === null) {
                // The raw response is in the console (logged above) for debugging
                throw new ShownError("The server sent an unexpected response. Please try again.");
            }
            if (data.error) throw new ShownError(data.error);
            return data;
        }

        // The three views send {"query": ...}
        function postQuery(endpoint, query) {
            return apiRequest("POST", endpoint, { query });
        }

        function setBusy(on, loadingText) {
            busy = on;
            document.getElementById("analyze-btn").disabled = on;
            for (const view of Object.keys(VIEWS)) document.getElementById(`tab-${view}`).disabled = on;
            document.getElementById("log-btn").disabled = on;
            const loading = document.getElementById("loading");
            if (on) {
                document.getElementById("follow-btn").disabled = true;
                document.getElementById("loading-text").textContent = loadingText;
                loading.classList.remove("hidden");
            } else {
                loading.classList.add("hidden");
                refreshFollowButton();
            }
        }

        // --- Dates ---
        const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

        // '2026-10-12T14:59:09Z' -> '12 Oct' (or '12 Oct 14:59' with the time), in UTC; '' if unreadable
        function formatDate(iso, withTime) {
            const d = new Date(iso);
            if (!iso || isNaN(d.getTime())) return "";
            const day = `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`;
            if (!withTime) return day;
            const pad = n => String(n).padStart(2, "0");
            return `${day} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`;
        }

        // '22 h ago', '3 days ago'
        function timeAgo(iso) {
            const d = new Date(iso);
            if (!iso || isNaN(d.getTime())) return "";
            const minutes = Math.max(0, Math.round((Date.now() - d.getTime()) / 60000));
            if (minutes < 1) return "just now";
            if (minutes < 60) return `${minutes} min ago`;
            const hours = Math.round(minutes / 60);
            if (hours < 48) return `${hours} h ago`;
            return `${Math.round(hours / 24)} days ago`;
        }

        function markTabs(active) {
            for (const view of Object.keys(VIEWS)) {
                const tab = document.getElementById(`tab-${view}`);
                const selected = view === active;
                tab.setAttribute("aria-selected", selected ? "true" : "false");
                tab.className = "px-4 py-2 -mb-px border-b-2 disabled:opacity-50 disabled:cursor-not-allowed " + (selected
                    ? "border-blue-600 text-blue-700 font-semibold"
                    : "border-transparent text-gray-600 hover:text-blue-700");
            }
        }

        // Shows a loaded answer: its text (HTML from the server; markdown2 safe_mode has
        // already escaped any raw HTML) and its own cited sources, each with its date
        function renderView(view) {
            const { html, sources } = answers[view];
            activeView = view;
            markTabs(view);
            document.getElementById("view-title").textContent = VIEWS[view].title;
            document.getElementById("summary").innerHTML = `
                <div class="prose max-w-none">
                    ${html}
                </div>
            `;
            const ratingEl = document.getElementById("rating");
            ratingEl.innerHTML = "";
            if (answers[view].answerId && answers[view].canRate) ratingEl.appendChild(ratingBar(answers[view]));
            const citedSourcesEl = document.getElementById("cited-sources");
            citedSourcesEl.innerHTML = "";
            if (sources && sources.length > 0) {
                sources.forEach(item => {
                    const li = document.createElement("li");
                    li.appendChild(makeLink(item.url, item.title, "text-blue-600 underline"));
                    const date = formatDate(item.published_at);
                    if (date) li.appendChild(textEl("span", ` · ${date}`, "text-gray-500"));
                    citedSourcesEl.appendChild(li);
                });
            } else {
                citedSourcesEl.innerHTML = "<li>No specific sources were cited.</li>";
            }
        }

        // Related Links come with the report and stay the same in every view. A link that
        // stands for a group of articles on one story says how many covered it.
        function renderRelatedLinks(links) {
            const relatedLinksEl = document.getElementById("related-links");
            relatedLinksEl.innerHTML = "";
            if (links && links.length > 0) {
                links.forEach(item => {
                    const card = document.createElement("div");
                    card.className = "p-3 border rounded-lg bg-white text-sm shadow-sm";
                    card.appendChild(makeLink(item.url, item.title, "font-medium text-blue-700 hover:underline"));
                    const source = document.createElement("p");
                    source.className = "text-gray-500 text-xs mt-1";
                    const inGroup = item.articles_in_group;
                    const count = inGroup > 1 ? `${inGroup} articles` : "";
                    source.textContent = [item.source || "", count].filter(Boolean).join(" · ");
                    card.appendChild(source);
                    relatedLinksEl.appendChild(card);
                });
            } else {
                relatedLinksEl.innerHTML = "<p>No related links found.</p>";
            }
        }

        // Analyze: a new topic. Shows its report and resets the Timeline and Contradictions tabs.
        async function fetchNews() {
            const query = document.getElementById("query").value.trim();
            const button = document.getElementById("analyze-btn");
            const resultDiv = document.getElementById("result");

            // A request is already running (Analyze and the tabs are disabled until it finishes)
            if (busy) return;

            hideError();
            if (!query) return showError("Please enter a topic first.");

            setBusy(true, VIEWS.report.loading);
            button.textContent = "Analyzing...";
            resultDiv.classList.add("hidden");
            hideUpdate();

            // Clear the old topic: its answers, report and links
            answers = {};
            shownQuery = null;
            document.getElementById("summary").innerHTML = "";
            document.getElementById("rating").innerHTML = "";
            document.getElementById("cited-sources").innerHTML = "";
            document.getElementById("related-links").innerHTML = "";

            try {
                const data = await postQuery(VIEWS.report.endpoint, query);
                console.log("Received data:", data); // Good for debugging
                // The server reports an empty answer as an error, so this shouldn't happen
                if (!data.summary_html) throw new ShownError(VIEWS.report.empty);

                answers.report = { html: data.summary_html, sources: data.cited_sources, answerId: data.answer_id || null,
                                   canRate: data.can_rate === true };
                renderView("report");
                renderRelatedLinks(data.related_links);
                // Only a fully drawn report makes this the topic the tabs ask about
                shownQuery = query;
                resultDiv.classList.remove("hidden");
            } catch (error) {
                answers = {};
                showError(messageFor(error));
            } finally {
                // Runs on every path (success, error, network failure), so the button always comes back
                setBusy(false);
                button.textContent = "Analyze";
            }
        }

        // A tab: shows that view of the topic on screen. The first click asks the server;
        // after that the kept answer is shown without a new request.
        async function showView(view) {
            if (busy || shownQuery === null || !VIEWS[view]) return;
            hideError();
            if (answers[view]) return renderView(view);

            const previous = activeView;
            setBusy(true, VIEWS[view].loading);
            try {
                const data = await postQuery(VIEWS[view].endpoint, shownQuery);
                const html = data[VIEWS[view].field];
                if (!html) throw new ShownError(VIEWS[view].empty);
                answers[view] = { html, sources: data.cited_sources, answerId: data.answer_id || null, canRate: data.can_rate === true };
                renderView(view);
            } catch (error) {
                // The view that was on screen stays (or is drawn again, if this one failed halfway
                // through drawing). Nothing is kept, so clicking the tab again retries.
                delete answers[view];
                if (activeView !== previous) renderView(previous);
                showError(messageFor(error));
            } finally {
                setBusy(false);
            }
        }

        // ===================== Following a topic (feature 1) =====================
        // The followed topics live in this browser (no login): [{watch_id, query, last_checked_at,
        // expired}]. Storage can be unavailable (private mode, blocked, full); the page then keeps
        // the list for this visit only.
        const FOLLOW_STORAGE_KEY = "aiNews.followed.v1";
        const WATCH_ID = /^[A-Za-z0-9_-]{22}$/;

        function loadFollowed() {
            try {
                const list = JSON.parse(localStorage.getItem(FOLLOW_STORAGE_KEY) || "[]");
                return Array.isArray(list)
                    ? list.filter(f => f && typeof f.query === "string" && WATCH_ID.test(f.watch_id || ""))
                    : [];
            } catch (e) {
                return [];
            }
        }

        function saveFollowed() {
            try {
                localStorage.setItem(FOLLOW_STORAGE_KEY, JSON.stringify(followed));
            } catch (e) {
                // Storage unavailable: the list still works until the page is closed
            }
        }

        let followed = loadFollowed();

        const normalizeTopic = q => String(q || "").split(/\s+/).filter(Boolean).join(" ").toLowerCase();
        const followedEntry = id => followed.find(f => f.watch_id === id);
        const followedTopic = query => followed.find(f => normalizeTopic(f.query) === normalizeTopic(query));

        // Under the report: "Follow this topic", or why it can't be followed
        function refreshFollowButton() {
            const button = document.getElementById("follow-btn");
            const note = document.getElementById("follow-note");
            if (shownQuery === null) return;
            if (followedTopic(shownQuery)) {
                button.textContent = "Following ✓";
                button.disabled = true;
                note.textContent = "Use Check in the Following list to see only what's new.";
            } else if (!answers.report || !answers.report.answerId) {
                button.textContent = "Follow this topic";
                button.disabled = true;
                note.textContent = "Following isn't available for this report right now.";
            } else {
                button.textContent = "Follow this topic";
                button.disabled = busy;
                note.textContent = "Come back later and see only what's new.";
            }
        }

        function renderFollowing() {
            const section = document.getElementById("following");
            const list = document.getElementById("following-list");
            list.innerHTML = "";
            if (followed.length === 0) {
                section.classList.add("hidden");
                return;
            }
            section.classList.remove("hidden");
            const button = (label, onClick, className) => {
                const b = textEl("button", label, className || "text-blue-700 hover:underline");
                b.onclick = onClick;
                return b;
            };
            for (const entry of followed) {
                const li = document.createElement("li");
                li.className = "py-2 flex flex-wrap items-center gap-x-4 gap-y-1";
                li.appendChild(textEl("span", entry.query, "font-medium"));
                const status = entry.expired
                    ? "expired"
                    : (entry.last_checked_at ? `checked ${timeAgo(entry.last_checked_at)}` : "not checked yet");
                li.appendChild(textEl("span", status, entry.expired ? "text-red-700" : "text-gray-500"));
                if (!entry.expired) {
                    li.appendChild(button("Check for updates", () => checkTopic(entry.watch_id),
                        "bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700"));
                    li.appendChild(button("Copy link", () => copyFollowLink(entry.watch_id)));
                }
                li.appendChild(button(entry.expired ? "Remove" : "Stop following", () => stopFollowing(entry.watch_id),
                    "text-gray-600 hover:underline"));
                list.appendChild(li);
            }
        }

        // Follow: saves the report on screen (and the other views already opened) as the
        // starting point. Later checks show only what these answers didn't contain.
        async function followTopic() {
            if (busy || shownQuery === null || !answers.report || !answers.report.answerId) return;
            hideError();
            const answerIds = {};
            for (const view of Object.keys(VIEWS)) {
                if (answers[view] && answers[view].answerId) answerIds[view] = answers[view].answerId;
            }
            setBusy(true, "Following this topic...");
            try {
                const data = await apiRequest("POST", "/api/follow", { query: shownQuery, answer_ids: answerIds });
                if (!WATCH_ID.test(data.watch_id || "")) throw new ShownError("The server sent an unexpected response. Please try again.");
                followed = followed.filter(f => f.watch_id !== data.watch_id);
                followed.push({ watch_id: data.watch_id, query: data.query || shownQuery, last_checked_at: null, followed_at: data.created_at });
                saveFollowed();
                renderFollowing();
                showNotice(`Following "${data.query || shownQuery}". Use Check for updates to see only what's new since this report.`);
            } catch (error) {
                showError(messageFor(error));
            } finally {
                setBusy(false);
            }
        }

        // Check for updates: only what's new since the last look
        async function checkTopic(watchId) {
            const entry = followedEntry(watchId);
            if (busy || !entry) return;
            hideError();
            setBusy(true, `Checking "${entry.query}" for updates...`);
            try {
                const data = await apiRequest("POST", `/api/follow/${encodeURIComponent(watchId)}/check`);
                entry.last_checked_at = data.checked_at || new Date().toISOString();
                entry.expired = false;
                saveFollowed();
                renderUpdate(data);
            } catch (error) {
                if (error instanceof ShownError && error.status === 404) {
                    // Expired on the server (30 days without a check) or a bad link: offer to remove it
                    entry.expired = true;
                    saveFollowed();
                }
                showError(messageFor(error));
            } finally {
                renderFollowing();
                setBusy(false);
            }
        }

        async function stopFollowing(watchId) {
            if (busy || !followedEntry(watchId)) return;
            hideError();
            // Removed from this browser at once; the server copy is deleted too, or expires by itself
            followed = followed.filter(f => f.watch_id !== watchId);
            saveFollowed();
            renderFollowing();
            refreshFollowButton();
            if (currentUpdate && currentUpdate.watch_id === watchId) hideUpdate();
            try {
                await apiRequest("DELETE", `/api/follow/${encodeURIComponent(watchId)}`);
            } catch (error) {
                if (!(error instanceof ShownError && error.status === 404)) {
                    showNotice("Removed from this browser. The server couldn't be reached, so the topic's saved history will expire on its own after 30 days.");
                }
            }
        }

        // A link that adds the followed topic to another browser's list
        function followLink(watchId) {
            return `${location.origin}${location.pathname}?follow=${encodeURIComponent(watchId)}`;
        }

        async function copyFollowLink(watchId) {
            const entry = followedEntry(watchId);
            if (!entry) return;
            hideError();
            let link;
            try {
                link = followLink(watchId);
                await navigator.clipboard.writeText(link);
                showNotice(`Link copied. Open it in another browser to follow "${entry.query}" there.`);
            } catch (e) {
                showNotice(link ? `Copy this link to follow "${entry.query}" in another browser: ${link}` : "Couldn't make a link here.");
            }
        }

        // Opening the page with ?follow=<id> adds that topic to this browser's list
        async function openFollowLink() {
            let watchId = null;
            try {
                watchId = new URLSearchParams(location.search).get("follow");
                if (watchId !== null) history.replaceState(null, "", location.pathname);
            } catch (e) {
                return;
            }
            if (watchId === null) return;
            if (!WATCH_ID.test(watchId)) {
                return showError("This follow link is incomplete. Copy the whole link again, or follow the topic yourself.");
            }
            if (followedEntry(watchId)) return;
            setBusy(true, "Opening the followed topic...");
            try {
                const data = await apiRequest("GET", `/api/follow/${encodeURIComponent(watchId)}`);
                followed.push({ watch_id: watchId, query: data.query, last_checked_at: data.checks ? data.last_checked_at : null });
                saveFollowed();
                renderFollowing();
                showNotice(`"${data.query}" is now in your Following list.`);
            } catch (error) {
                showError(messageFor(error));
            } finally {
                setBusy(false);
            }
        }

        // --- The update view ---

        function hideUpdate() {
            currentUpdate = null;
            document.getElementById("update-view").classList.add("hidden");
            document.getElementById("story-log").classList.add("hidden");
        }

        function linkList(links) {
            const ul = document.createElement("ul");
            ul.className = "list-disc ml-5 space-y-1 text-sm";
            for (const item of links || []) {
                const li = document.createElement("li");
                li.appendChild(makeLink(item.url, item.title, "text-blue-600 underline"));
                const meta = [item.source_name, formatDate(item.published_at)].filter(Boolean).join(", ");
                if (meta) li.appendChild(textEl("span", ` (${meta})`, "text-gray-500"));
                ul.appendChild(li);
            }
            return ul;
        }

        // HTML from the server: summaries and new facts went through markdown2 safe_mode (escaped)
        function serverHtml(html) {
            const div = document.createElement("div");
            div.className = "prose max-w-none my-2";
            div.innerHTML = html;
            return div;
        }

        function storyCard() {
            const card = document.createElement("div");
            card.className = "p-4 border rounded-lg bg-white shadow-sm";
            return card;
        }

        function renderUpdate(data) {
            currentUpdate = data;
            document.getElementById("result").classList.add("hidden");
            document.getElementById("update-view").classList.remove("hidden");
            document.getElementById("story-log").classList.add("hidden");
            document.getElementById("log-btn").textContent = "Story log ▸";
            document.getElementById("update-title").textContent = `What's new: ${data.query}`;

            const w = data.window || {};
            let windowText = `Covers articles published ${formatDate(w.from, true)} – ${formatDate(w.to_approx, true)} UTC `
                + "(up to the 10 best matches; the news feed runs about 12 hours behind).";
            if (data.reused) windowText += ` Shown from your check ${timeAgo(data.checked_at)}.`;
            document.getElementById("update-window").textContent = windowText;

            const gapEl = document.getElementById("update-gap");
            if (w.gap_not_covered) {
                gapEl.textContent = `Your last check was a while ago: articles published between ${formatDate(w.gap_not_covered.from, true)} `
                    + `and ${formatDate(w.gap_not_covered.to, true)} UTC couldn't be searched.`;
                gapEl.classList.remove("hidden");
            } else {
                gapEl.classList.add("hidden");
            }
            const messageEl = document.getElementById("update-message");
            if (data.message) {
                messageEl.textContent = data.message;
                messageEl.classList.remove("hidden");
            } else {
                messageEl.classList.add("hidden");
            }

            const body = document.getElementById("update-body");
            body.innerHTML = "";
            const newStories = data.new_stories || [];
            const updates = data.updates || [];

            if (data.nothing_new) {
                const since = data.previous_check ? ` (${timeAgo(data.previous_check)})` : "";
                body.appendChild(textEl("p", `Nothing new since your last check${since}.`, "p-4 border rounded-lg bg-white"));
            }

            if (newStories.length) {
                body.appendChild(textEl("h3", `New stories (${newStories.length})`, "font-semibold"));
                for (const story of newStories) {
                    const card = storyCard();
                    const first = (story.links || [])[0] || {};
                    card.appendChild(makeLink(first.url, story.title, "font-medium text-blue-700 hover:underline"));
                    const count = `${story.articles} ${story.articles === 1 ? "article" : "articles"}`;
                    card.appendChild(textEl("p", [(story.outlets || []).join(", "), count].filter(Boolean).join(" · "), "text-xs text-gray-500 mt-1"));
                    if (story.related_to) {
                        card.appendChild(textEl("p", `Related to: ${story.related_to.title}`, "text-xs text-gray-600 mt-1"));
                    }
                    card.appendChild(story.summary_html
                        ? serverHtml(story.summary_html)
                        : textEl("p", "No summary: the AI couldn't check this story. The articles are linked below.", "text-sm text-gray-600 my-2"));
                    card.appendChild(linkList(story.links));
                    body.appendChild(card);
                }
            }

            if (updates.length) {
                body.appendChild(textEl("h3", `Updates on stories you've seen (${updates.length})`, "font-semibold"));
                for (const update of updates) {
                    const card = storyCard();
                    card.appendChild(textEl("p", update.story_title, "font-medium"));
                    if (update.first_seen) card.appendChild(textEl("p", `First seen ${formatDate(update.first_seen)}`, "text-xs text-gray-500 mt-1"));
                    card.appendChild(serverHtml(update.new_facts_html));
                    card.appendChild(linkList(update.links));
                    body.appendChild(card);
                }
            }

            const hidden = data.hidden_repeats || [];
            if (hidden.length) {
                const box = document.createElement("div");
                box.className = "text-sm text-gray-600";
                const n = hidden.length;
                box.appendChild(textEl("span", `${n} new ${n === 1 ? "article" : "articles"} only repeated what you'd already seen, so ${n === 1 ? "it's" : "they're"} hidden. `));
                const list = linkList(hidden);
                list.classList.add("hidden");
                const toggle = textEl("button", "Show them", "text-blue-700 hover:underline");
                toggle.onclick = () => {
                    const open = list.classList.contains("hidden");
                    if (open) list.classList.remove("hidden"); else list.classList.add("hidden");
                    toggle.textContent = open ? "Hide them" : "Show them";
                };
                box.appendChild(toggle);
                box.appendChild(list);
                body.appendChild(box);
            }

            const unreadable = data.unreadable || [];
            if (unreadable.length) {
                const box = document.createElement("div");
                box.className = "text-sm text-gray-600";
                box.appendChild(textEl("p", "Also found, but couldn't be read (blocked or paywalled):"));
                box.appendChild(linkList(unreadable));
                body.appendChild(box);
            }

            if (newStories.some(s => s.summary_html) || updates.length) {
                body.appendChild(textEl("p", "Summaries are AI-written from the linked articles.", "text-xs text-gray-500"));
            }
            if (data.answer_id && data.can_rate === true) {
                data.ratingTarget = data.ratingTarget || { answerId: data.answer_id };
                body.appendChild(ratingBar(data.ratingTarget));
            }
        }

        // ===================== Rating an answer (feature 2, Section J) =====================
        // 👍 / 👎 under each view and under a check's update. The page sends the answer_id it already
        // has (never a trace id); the server puts the rating on the trace that wrote the answer. 👎
        // opens an optional comment box. Clicking again changes the rating: the server keeps one per
        // answer. Saving a rating doesn't block the rest of the page (no setBusy).
        const MAX_COMMENT = 1000;

        // target: the answer being rated, {answerId, rating}. rating ({score, comment}) is kept on it,
        // so switching tabs and back shows what was already sent.
        function ratingBar(target) {
            const state = target.rating || (target.rating = { score: null, comment: "" });
            const bar = document.createElement("div");
            bar.className = "mt-3 flex flex-wrap items-center gap-2 text-sm";
            bar.setAttribute("role", "group");
            bar.setAttribute("aria-label", "Rate this answer");
            bar.appendChild(textEl("span", "Was this useful?", "text-gray-600"));

            const choice = (emoji, label, score) => {
                // The chosen one is shown (blue) as well as announced (aria-pressed)
                const b = textEl("button", emoji, "px-2 py-1 border rounded hover:bg-gray-100 disabled:opacity-50 "
                    + "aria-pressed:bg-blue-100 aria-pressed:border-blue-600 aria-pressed:ring-1 aria-pressed:ring-blue-600");
                b.setAttribute("type", "button");
                b.setAttribute("aria-label", label);
                b.onclick = () => send(score, score === -1 ? state.comment : null);
                return b;
            };
            const up = choice("👍", "Useful", 1);
            const down = choice("👎", "Not useful", -1);
            bar.appendChild(up);
            bar.appendChild(down);

            // Announced by screen readers; the error is an alert, next to the buttons it belongs to
            const status = textEl("span", "", "text-green-700");
            status.setAttribute("role", "status");
            const error = textEl("span", "", "hidden text-red-700");
            error.setAttribute("role", "alert");
            bar.appendChild(status);
            bar.appendChild(error);

            // The comment box, after 👎
            const form = document.createElement("div");
            form.className = "hidden w-full flex flex-wrap items-start gap-2";
            const box = document.createElement("textarea");
            box.className = "flex-1 min-w-[16rem] border rounded p-2";
            box.setAttribute("rows", "2");
            box.setAttribute("maxlength", String(MAX_COMMENT));
            box.setAttribute("aria-label", "What was wrong? (optional)");
            box.setAttribute("placeholder", "What was wrong? (optional)");
            box.value = state.comment || "";
            const sendComment = textEl("button", "Send comment", "border border-blue-600 text-blue-700 px-3 py-1 rounded hover:bg-blue-50 disabled:opacity-50");
            sendComment.setAttribute("type", "button");
            sendComment.onclick = () => send(-1, box.value);
            form.appendChild(box);
            form.appendChild(sendComment);
            bar.appendChild(form);

            const show = () => {
                up.setAttribute("aria-pressed", state.score === 1 ? "true" : "false");
                down.setAttribute("aria-pressed", state.score === -1 ? "true" : "false");
                if (state.score === -1) form.classList.remove("hidden"); else form.classList.add("hidden");
                status.textContent = state.score === null ? "" : (state.comment ? "Thanks, your feedback and comment were saved." : "Thanks, your feedback was saved.");
            };

            let sending = false;
            async function send(score, comment) {
                if (sending) return;
                const text = (comment || "").trim();
                if (text.length > MAX_COMMENT) {
                    error.textContent = `Your comment is too long. Please keep it under ${MAX_COMMENT.toLocaleString("en-US")} characters.`;
                    return error.classList.remove("hidden");
                }
                sending = true;
                for (const b of [up, down, sendComment]) b.disabled = true;
                error.classList.add("hidden");
                status.textContent = "Saving...";
                const firstDown = score === -1 && state.score !== -1;
                try {
                    await apiRequest("POST", "/api/feedback", { answer_id: target.answerId, score, comment: text || null });
                    state.score = score;
                    state.comment = text;
                    show();
                    // 👎 saved: offer the comment box, with the keyboard focus in it
                    if (firstDown && box.focus) box.focus();
                } catch (e) {
                    show();
                    error.textContent = messageFor(e);
                    error.classList.remove("hidden");
                } finally {
                    sending = false;
                    for (const b of [up, down, sendComment]) b.disabled = false;
                }
            }

            show();
            return bar;
        }

        // --- The story log: every story this topic has had ---
        async function toggleLog() {
            const logEl = document.getElementById("story-log");
            const button = document.getElementById("log-btn");
            if (busy || !currentUpdate) return;
            if (!logEl.classList.contains("hidden")) {
                logEl.classList.add("hidden");
                button.textContent = "Story log ▸";
                return;
            }
            hideError();
            setBusy(true, "Loading the story log...");
            try {
                const data = await apiRequest("GET", `/api/follow/${encodeURIComponent(currentUpdate.watch_id)}`);
                logEl.innerHTML = "";
                const stories = data.stories || [];
                logEl.appendChild(textEl("p", `${stories.length} ${stories.length === 1 ? "story" : "stories"} since ${formatDate(data.created_at)}`, "text-gray-600"));
                for (const story of stories) {
                    const card = storyCard();
                    const first = (story.links || [])[0] || {};
                    card.appendChild(makeLink(first.url, story.title, "font-medium text-blue-700 hover:underline"));
                    const seen = formatDate(story.first_seen) === formatDate(story.last_seen)
                        ? `Seen ${formatDate(story.first_seen)}`
                        : `First seen ${formatDate(story.first_seen)}, last seen ${formatDate(story.last_seen)}`;
                    const count = `${story.articles_seen} ${story.articles_seen === 1 ? "article" : "articles"}`;
                    card.appendChild(textEl("p", [seen, (story.outlets || []).join(", "), count].filter(Boolean).join(" · "), "text-xs text-gray-500 mt-1"));
                    if (story.related_to && story.related_to.title) {
                        card.appendChild(textEl("p", `Related to: ${story.related_to.title}`, "text-xs text-gray-600 mt-1"));
                    }
                    logEl.appendChild(card);
                }
                logEl.classList.remove("hidden");
                button.textContent = "Story log ▾";
            } catch (error) {
                showError(messageFor(error));
            } finally {
                setBusy(false);
            }
        }

        renderFollowing();
        openFollowLink();
    </script>
</body>
</html>
