<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI News Analyst</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Add simple styles for the summary content */
        .prose p { margin-bottom: 1rem; }
        .prose ul { list-style-type: disc; margin-left: 1.5rem; }
        .prose ol { list-style-type: decimal; margin-left: 1.5rem; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="max-w-6xl mx-auto mt-16 p-6">
        <h1 class="text-3xl font-bold text-center mb-4">AI News Analyst 🧠</h1>
        <p class="text-center text-gray-600 mb-6">
            Ask any topic. I'll analyze today's news, find the key themes, and give you a synthesized report.
        </p>

        <div class="flex gap-2">
            <input id="query" type="text" class="flex-1 border p-3 rounded-lg" placeholder="Enter your topic, e.g. 'Future of AI in healthcare'">
            <button id="analyze-btn" onclick="fetchNews()" class="bg-blue-600 text-white px-4 rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-blue-600">Analyze</button>
        </div>

        <div id="loading" class="hidden text-center mt-6 text-blue-600 font-medium">
            <p id="loading-text">Analyzing... This can take a moment for a new topic.</p>
        </div>

        <div id="error" role="alert" class="hidden mt-6 p-4 border border-red-300 rounded-lg bg-red-50 text-red-700"></div>

        <div id="result" class="hidden mt-8 grid grid-cols-4 gap-8">

            <div class="col-span-4 md:col-span-3">
                <!-- Three views of the same topic. Timeline and Contradictions are loaded on first click -->
                <div role="tablist" aria-label="Views" class="flex gap-1 mb-4 border-b">
                    <button id="tab-report" role="tab" aria-selected="true" onclick="showView('report')" class="px-4 py-2 -mb-px">Report</button>
                    <button id="tab-timeline" role="tab" aria-selected="false" onclick="showView('timeline')" class="px-4 py-2 -mb-px">Timeline</button>
                    <button id="tab-contradictions" role="tab" aria-selected="false" onclick="showView('contradictions')" class="px-4 py-2 -mb-px">Contradictions</button>
                </div>
                <h2 id="view-title" class="text-xl font-semibold mb-3">Intelligence Report</h2>
                <div id="summary" class="mb-6 p-4 border rounded-lg bg-white shadow-sm">
                    </div>
                
                <h3 class="font-semibold mb-2">Cited Sources</h3>
                <ul id="cited-sources" class="list-disc ml-5 space-y-1 text-sm">
                    </ul>
            </div>

            <div class="col-span-4 md:col-span-1">
                <h2 class="text-xl font-semibold mb-3">Related Links</h2>
                <div id="related-links" class="space-y-3">
                    </div>
            </div>

        </div>

    </div>

    <script>
        // Only absolute http(s) URLs become links; javascript:, data: and anything unparseable don't
        function safeUrl(url) {
            try {
                const parsed = new URL(url);
                return (parsed.protocol === "http:" || parsed.protocol === "https:") ? parsed.href : null;
            } catch (e) {
                return null;
            }
        }

        // Builds a link with DOM methods. Titles come from news sites, so they are set with
        // textContent and can never be parsed as HTML. Unsafe URLs are shown as plain text.
        function makeLink(url, text, className) {
            const href = safeUrl(url);
            const el = document.createElement(href ? "a" : "span");
            el.className = className;
            el.textContent = text || href || "Untitled";
            if (href) {
                el.setAttribute("href", href);
                el.setAttribute("target", "_blank");
                // noopener: the opened page can't control this tab through window.opener
                el.setAttribute("rel", "noopener noreferrer");
            }
            return el;
        }

        // A full build takes ~30 s and the server gives the AI step at most 75 s, so a slow
        // request still gets the server's own message first. After this long it is given up.
        const REQUEST_TIMEOUT_MS = 120000;

        // The message to show for an error response. The server sends a user-friendly
        // message as {"detail": "..."} for every failure it knows about; a response without
        // one comes from somewhere else (e.g. Render's proxy while the server is starting).
        function friendlyError(status, detail) {
            if (typeof detail === "string" && detail.trim()) return detail;
            if (status === 502 || status === 503 || status === 504) {
                return "The server is starting up or busy. Please wait a few seconds and try again.";
            }
            return "Something went wrong on our side. Please try again.";
        }

        function showError(message) {
            const errorEl = document.getElementById("error");
            // textContent, not innerHTML: server text is shown as text, never parsed as HTML
            errorEl.textContent = message;
            errorEl.classList.remove("hidden");
        }

        function hideError() {
            document.getElementById("error").classList.add("hidden");
        }

        // The three views of a topic: where each one's answer comes from and how it is shown
        const VIEWS = {
            report: {
                endpoint: "/query", field: "summary_html", title: "Intelligence Report",
                loading: "Analyzing... This can take a moment for a new topic.",
                empty: "The AI couldn't write the report. Please try again.",
            },
            timeline: {
                endpoint: "/api/timeline", field: "timeline_html", title: "Timeline",
                loading: "Writing the timeline...",
                empty: "The AI couldn't write the timeline. Please try again.",
            },
            contradictions: {
                endpoint: "/api/contradictions", field: "analysis_html", title: "Conflicting Reports",
                loading: "Looking for conflicting reports...",
                empty: "The AI couldn't write the analysis of conflicting reports. Please try again.",
            },
        };

        let busy = false;          // a request is running: Analyze and the tabs wait for it
        let shownQuery = null;     // the topic of the report on screen; the tabs ask about this one
        let answers = {};          // view -> {html, sources}, kept until the next Analyze
        let activeView = "report";

        // An error whose message is meant for the user. Any other error is a bug in this page.
        class ShownError extends Error {}

        function messageFor(error) {
            if (error instanceof ShownError) return error.message;
            console.error(error);
            return "Something went wrong on our side. Please try again.";
        }

        // One request to our API, shared by all three views: the 120 s timeout, network errors,
        // the server's own error messages and invalid JSON are handled here once.
        // Returns the parsed response, or throws a ShownError with the message to show.
        async function postQuery(endpoint, query) {
            // Gives up on a request that hangs (e.g. a dropped connection) instead of waiting forever
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
            let response, responseText;
            try {
                response = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query }),
                    signal: controller.signal
                });
                responseText = await response.text();
            } catch (networkError) {
                console.error("Network error:", networkError);
                throw new ShownError(networkError.name === "AbortError"
                    ? "The request took too long. Please try again."
                    : "Couldn't reach the server. Check your internet connection and try again.");
            } finally {
                clearTimeout(timer);
            }

            let data = null;
            try {
                data = JSON.parse(responseText);
            } catch (parseError) {
                console.error("Failed to parse JSON:", responseText);
            }
            if (!response.ok) {
                // Our errors look like {"detail": "No news from the last 2 days was found for ..."}
                throw new ShownError(friendlyError(response.status, data && data.detail));
            }
            if (data === null) {
                // The raw response is in the console (logged above) for debugging
                throw new ShownError("The server sent an unexpected response. Please try again.");
            }
            if (data.error) throw new ShownError(data.error);
            return data;
        }

        function setBusy(on, loadingText) {
            busy = on;
            document.getElementById("analyze-btn").disabled = on;
            for (const view of Object.keys(VIEWS)) document.getElementById(`tab-${view}`).disabled = on;
            const loading = document.getElementById("loading");
            if (on) {
                document.getElementById("loading-text").textContent = loadingText;
                loading.classList.remove("hidden");
            } else {
                loading.classList.add("hidden");
            }
        }

        function markTabs(active) {
            for (const view of Object.keys(VIEWS)) {
                const tab = document.getElementById(`tab-${view}`);
                const selected = view === active;
                tab.setAttribute("aria-selected", selected ? "true" : "false");
                tab.className = "px-4 py-2 -mb-px border-b-2 disabled:opacity-50 disabled:cursor-not-allowed " + (selected
                    ? "border-blue-600 text-blue-700 font-semibold"
                    : "border-transparent text-gray-600 hover:text-blue-700");
            }
        }

        // Shows a loaded answer: its text (HTML from the server; markdown2 safe_mode has
        // already escaped any raw HTML) and its own cited sources
        function renderView(view) {
            const { html, sources } = answers[view];
            activeView = view;
            markTabs(view);
            document.getElementById("view-title").textContent = VIEWS[view].title;
            document.getElementById("summary").innerHTML = `
                <div class="prose max-w-none">
                    ${html}
                </div>
            `;
            const citedSourcesEl = document.getElementById("cited-sources");
            citedSourcesEl.innerHTML = "";
            if (sources && sources.length > 0) {
                sources.forEach(item => {
                    const li = document.createElement("li");
                    li.appendChild(makeLink(item.url, item.title, "text-blue-600 underline"));
                    citedSourcesEl.appendChild(li);
                });
            } else {
                citedSourcesEl.innerHTML = "<li>No specific sources were cited.</li>";
            }
        }

        // Related Links come with the report and stay the same in every view
        function renderRelatedLinks(links) {
            const relatedLinksEl = document.getElementById("related-links");
            relatedLinksEl.innerHTML = "";
            if (links && links.length > 0) {
                links.forEach(item => {
                    const card = document.createElement("div");
                    card.className = "p-3 border rounded-lg bg-white text-sm shadow-sm";
                    card.appendChild(makeLink(item.url, item.title, "font-medium text-blue-700 hover:underline"));
                    const source = document.createElement("p");
                    source.className = "text-gray-500 text-xs mt-1";
                    source.textContent = item.source || "";
                    card.appendChild(source);
                    relatedLinksEl.appendChild(card);
                });
            } else {
                relatedLinksEl.innerHTML = "<p>No related links found.</p>";
            }
        }

        // Analyze: a new topic. Shows its report and resets the Timeline and Contradictions tabs.
        async function fetchNews() {
            const query = document.getElementById("query").value.trim();
            const button = document.getElementById("analyze-btn");
            const resultDiv = document.getElementById("result");

            // A request is already running (Analyze and the tabs are disabled until it finishes)
            if (busy) return;

            hideError();
            if (!query) return showError("Please enter a topic first.");

            setBusy(true, VIEWS.report.loading);
            button.textContent = "Analyzing...";
            resultDiv.classList.add("hidden");

            // Clear the old topic: its answers, report and links
            answers = {};
            shownQuery = null;
            document.getElementById("summary").innerHTML = "";
            document.getElementById("cited-sources").innerHTML = "";
            document.getElementById("related-links").innerHTML = "";

            try {
                const data = await postQuery(VIEWS.report.endpoint, query);
                console.log("Received data:", data); // Good for debugging
                // The server reports an empty answer as an error, so this shouldn't happen
                if (!data.summary_html) throw new ShownError(VIEWS.report.empty);

                answers.report = { html: data.summary_html, sources: data.cited_sources };
                renderView("report");
                renderRelatedLinks(data.related_links);
                // Only a fully drawn report makes this the topic the tabs ask about
                shownQuery = query;
                resultDiv.classList.remove("hidden");
            } catch (error) {
                answers = {};
                showError(messageFor(error));
            } finally {
                // Runs on every path (success, error, network failure), so the button always comes back
                setBusy(false);
                button.textContent = "Analyze";
            }
        }

        // A tab: shows that view of the topic on screen. The first click asks the server;
        // after that the kept answer is shown without a new request.
        async function showView(view) {
            if (busy || shownQuery === null || !VIEWS[view]) return;
            hideError();
            if (answers[view]) return renderView(view);

            const previous = activeView;
            setBusy(true, VIEWS[view].loading);
            try {
                const data = await postQuery(VIEWS[view].endpoint, shownQuery);
                const html = data[VIEWS[view].field];
                if (!html) throw new ShownError(VIEWS[view].empty);
                answers[view] = { html, sources: data.cited_sources };
                renderView(view);
            } catch (error) {
                // The view that was on screen stays (or is drawn again, if this one failed halfway
                // through drawing). Nothing is kept, so clicking the tab again retries.
                delete answers[view];
                if (activeView !== previous) renderView(previous);
                showError(messageFor(error));
            } finally {
                setBusy(false);
            }
        }
    </script>
</body>
</html>
